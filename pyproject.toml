[project]
name = "insights"
authors = [
    { name = "Powerful Reporting Tool for Frappe Apps", email = "hello@frappe.io"}
]
description = "Open Source Business Intelligence Tool"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "pandas~=2.2.2",
    "SQLAlchemy>=2.0.36",
    "python-telegram-bot==21.4",
    "duckdb~=1.3.0",
    "sqlglot<28.0.0",
    "ibis-framework~=10.5.0",
    "ibis-framework[duckdb]",
    "ibis-framework[mysql]",
    "ibis-framework[sqlite]",
    "ibis-framework[clickhouse]",
    "ibis-framework[postgres]",
    # "ibis-framework[mssql]",
    # "ibis-framework[bigquery]",

    # --- ML runtime -------------------------------------------------------
    # Not optional, and not an extra. These lived in an `ml` extra, but
    # `bench get-app` runs `pip install -e apps/insights` and never requests
    # extras -- so on every normal install none of them existed. statsmodels
    # was not declared anywhere at all, which is why `_forecast_holt_winters`
    # ImportError'd on every call and every forecast silently degraded to a
    # weighted moving average nobody could see.
    #
    # Installing the app installs the ML layer. Whether a given model may *run*
    # is decided at runtime against the data (see PROPHET_MIN_DAYS in
    # sales_forecasting.py) -- never by leaving a library out.
    "scikit-learn>=1.3.0",   # payment default, lead conversion, GL anomalies
    "statsmodels>=0.14.0",   # Holt-Winters -- fits the history this site has
    "prophet>=1.1.4",        # + cmdstanpy; gated on >=2yr history at runtime
    # xgboost and lightgbm are imported by nothing. They were kept because
    # `insights.ml.base.ensure_dependencies` reported them, but that function
    # now probes the five libraries the app actually uses and xgboost is not
    # among them, so the justification no longer holds. 19 MB installed and
    # build time on every deploy, for no behaviour. Delete these two lines when
    # you want them gone; nothing imports them.
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
]

[project.optional-dependencies]
nlp = ["transformers>=4.36.0", "spacy>=3.7.0", "langchain>=0.0.350"]
vectordb = ["chromadb>=0.4.0", "faiss-cpu>=1.7.4", "elasticsearch>=8.11.0"]
export = ["plotly>=5.17.0", "weasyprint>=60.0", "python-pptx>=0.6.23", "reportlab>=4.0.0"]
all = ["insights[nlp,vectordb,export]"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "E731", # do not assign a lambda expression, use a def
    # "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
