[project]
name = "insights"
authors = [
    { name = "Powerful Reporting Tool for Frappe Apps", email = "hello@frappe.io"}
]
description = "Open Source Business Intelligence Tool"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # pandas 2.3.3 is the only 2.x release with a cp314 wheel (2.2.x stops at
    # cp313, and 2.2 predates 3.14's C API), so on this app's own Python the
    # previous `~=2.2.2` could only be satisfied by building 2.2 from source
    # against whatever numpy happened to be present -- which is how you get a
    # `pandas_datetime`/`np_datetime` pair that segfaults on the first date a
    # query returns. Below 3.x: ibis materialises results through
    # `ibis.formats.pandas`, which is not tested against pandas 3.
    "pandas>=2.3.3,<3",
    # Declared rather than left transitive: this app's crash surface is native,
    # and an unpinned numpy resolves to whatever shipped this week against a
    # pandas built months earlier.
    "numpy>=2.3,<3",
    "SQLAlchemy>=2.0.36",
    "python-telegram-bot==21.4",
    "duckdb~=1.3.0",
    "sqlglot<28.0.0",
    # sql-metadata 3.x rewrote its parser onto sqlglot>=30.12, which conflicts
    # with the <28.0.0 pin above (ibis/pandas compat, see above). Left
    # unpinned, a later app's `uv pip install --upgrade` in the same shared
    # venv (e.g. exim, installed after this app but before sql_metadata's own
    # owner -- frappe -- gets re-resolved) can silently drift sql_metadata to
    # 3.x while sqlglot stays capped here, breaking `from sql_metadata import
    # Parser` (and therefore frappe.desk.reportview, and therefore every
    # app's bench build) with `ModuleNotFoundError: No module named
    # 'sqlglot.parsers'`. Pinned here because this app installs early
    # (idx 3 in sites/apps.json) and already owns the sqlglot cap.
    "sql_metadata<3.0",
    # 11 is what this app is verified against; `~=10.5.0` excluded it while
    # every bench ran it anyway. ibis declares no pandas or numpy constraint of
    # its own, so the two above are the only thing pinning the native stack
    # underneath `ibis.formats.pandas`.
    "ibis-framework>=10.5,<12",
    "ibis-framework[duckdb]",
    "ibis-framework[mysql]",
    "ibis-framework[sqlite]",
    "ibis-framework[clickhouse]",
    "ibis-framework[postgres]",
    # "ibis-framework[mssql]",
    # "ibis-framework[bigquery]",

    # --- ML runtime -------------------------------------------------------
    # scikit-learn and statsmodels are lazy-imported (inside functions, never
    # at module level) and fork-safe, so they are core dependencies: the
    # payment-default, lead-conversion, GL-anomaly, and Holt-Winters paths all
    # need them and degrade silently if they are absent.
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",
    # Pins native BLAS/OpenMP thread pools to 1 around every ML compute (see
    # insights.api.ml.utils._compute) -- already a transitive dep of
    # scikit-learn, declared explicitly because insights imports it directly.
    "threadpoolctl>=3.0.0",
    # Prophet is deliberately NOT here. It pulls cmdstanpy + Intel TBB
    # (libtbb), a native thread pool that cannot survive rq's per-job fork() --
    # the work-horse dies as "waitpid returned 139 (signal 11)" with no Python
    # traceback. This is why ML works on master/restaurant (Prophet was in an
    # uninstalled extra) and segfaulted on jkm (Prophet was promoted to core).
    # The app degrades gracefully without it: _check_prophet() returns False
    # and train() falls back to Holt-Winters (statsmodels). Install it on a
    # bench that wants it via `pip install prophet` + the FRAPPE_BACKGROUND_
    # WORKERS_NOFORK=true env var, or use the no-fork worker class.
    # xgboost and lightgbm are removed: nothing in the app imports them.

    # --- AI Knowledge Base --------------------------------------------------
    # The KB doctype (insights.ai.knowledge_base) hard-imports chromadb
    # unconditionally -- it was only reachable before because some other app
    # in the shared bench env happened to install it transitively. Promoted
    # out of the `vectordb` extra below: this is no longer optional.
    "chromadb>=0.4.0",
    # Routes AI Knowledge Base embeddings through whichever chat provider
    # Insights Settings already has configured, instead of hard-requiring a
    # second, separate OpenAI key (see insights.ai.base_provider).
    "litellm>=1.50.0",
    # Sentence/paragraph-boundary-aware chunker for the KB pipeline, replacing
    # the hand-rolled separator walk in insights.ai.knowledge_base.chunk_text.
    "langchain-text-splitters>=0.3.0",
    # Spans around agents/base.py's make_request/execute and the KB
    # embed/query path. An unconfigured SDK is a documented no-op by design,
    # so this is safe with no OTLP collector present.
    "opentelemetry-api>=1.42.0",
    "opentelemetry-sdk>=1.42.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.0",
]

[project.optional-dependencies]
ml = ["prophet>=1.1.4"]
nlp = ["transformers>=4.36.0", "spacy>=3.7.0", "langchain>=0.0.350"]
vectordb = ["faiss-cpu>=1.7.4", "elasticsearch>=8.11.0"]
all = ["insights[ml,nlp,vectordb,export]"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"


[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "E731", # do not assign a lambda expression, use a def
    # "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "RUF001", # string contains ambiguous unicode character
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
